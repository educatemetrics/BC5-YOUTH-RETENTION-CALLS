<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>E!BA Retention Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0F6A8C 0%, #0e313e 100%);
            min-height: 100vh;
            padding: 0;
        }

        /* Password Protection Styles */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0F6A8C 0%, #0e313e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .password-overlay.hidden {
            display: none;
        }

        .password-modal {
            background: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .password-modal h2 {
            color: #870101;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .password-modal p {
            color: #666666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .password-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #0F6A8C;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .password-input:focus {
            outline: none;
            border-color: #870101;
        }

        .password-submit {
            width: 100%;
            padding: 14px;
            background: #870101;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            touch-action: manipulation;
        }

        .password-submit:active {
            background: #A03434;
        }

        .password-error {
            color: #870101;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Main Container */
        .container {
            max-width: 100%;
            margin: 0;
            padding: 10px;
        }

        /* Header - Compact for Mobile */
        .header {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #870101;
        }

        .header h1 {
            color: #870101;
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .venue-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #0F6A8C;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            color: #0e313e;
            position: relative;
        }

        .venue-search-container {
            position: relative;
            width: 100%;
        }

        .venue-search-input {
            width: 100%;
            padding: 12px;
            padding-right: 40px;
            border: 2px solid #0F6A8C;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            color: #0e313e;
        }

        .venue-search-input:focus {
            outline: none;
            border-color: #870101;
        }

        .venue-clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666666;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            display: none;
        }

        .venue-clear-btn.show {
            display: block;
        }

        .venue-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #0F6A8C;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .venue-dropdown.show {
            display: block;
        }

        .venue-option {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #e2e8f0;
            font-size: 15px;
            color: #0e313e;
        }

        .venue-option:hover,
        .venue-option.highlighted {
            background: #f7fafc;
        }

        .venue-option:last-child {
            border-bottom: none;
        }

        .venue-option.no-results {
            color: #666666;
            text-align: center;
            cursor: default;
        }

        .venue-option.no-results:hover {
            background: white;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .date-filter {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .date-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #0F6A8C;
            background: white;
            color: #0F6A8C;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            touch-action: manipulation;
        }

        .date-btn.active {
            background: #870101;
            color: white;
            border-color: #870101;
        }

        .refresh-btn {
            padding: 10px 16px;
            background: #870101;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .refresh-btn:active {
            background: #A03434;
        }

        .refresh-btn:disabled {
            background: #666666;
        }

        .last-updated {
            color: #666666;
            font-size: 11px;
            text-align: center;
        }

        /* Metrics Grid - Mobile Optimized */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .metric-card {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .metric-label {
            font-size: 11px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
        }

        /* Educate! Brand Colors */
        .metric-card.absent { border-left: 3px solid #A03434; }
        .metric-card.absent .metric-value { color: #A03434; }
        
        .metric-card.called { border-left: 3px solid #4D889D; }
        .metric-card.called .metric-value { color: #4D889D; }
        
        .metric-card.reached { border-left: 3px solid #0e313e; }
        .metric-card.reached .metric-value { color: #0e313e; }
        
        .metric-card.promised { border-left: 3px solid #f4b14d; }
        .metric-card.promised .metric-value { color: #f4b14d; }
        
        .metric-card.refused { border-left: 3px solid #870101; }
        .metric-card.refused .metric-value { color: #870101; }
        
        .metric-card.returned { border-left: 3px solid #4F9262; }
        .metric-card.returned .metric-value { color: #4F9262; }

        /* Data Section - Mobile Optimized */
        .data-section {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .section-header {
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #870101;
            margin-bottom: 10px;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            border: 2px solid #0F6A8C;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #870101;
        }

        /* Youth Cards - Mobile Friendly */
        .youth-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .youth-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #0F6A8C;
            border-radius: 8px;
            padding: 12px;
        }

        .youth-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .youth-name {
            font-weight: 700;
            color: #0e313e;
            font-size: 15px;
        }

        .youth-id-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #4F9262;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            touch-action: manipulation;
        }

        .youth-id-btn:active {
            background: #008148;
        }

        .youth-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 13px;
        }

        .youth-detail {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #666666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }

        .detail-value {
            color: #0e313e;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            margin-top: 2px;
        }

        .status-not-called { background: #fde8e8; color: #870101; }
        .status-called { background: #e3f2f7; color: #0F6A8C; }
        .status-reached { background: #d4e4e9; color: #0e313e; }
        .status-promised { background: #fef5e7; color: #F1A01B; }
        .status-refused { background: #fde0e0; color: #A03434; }
        .status-returned { background: #e8f5ed; color: #008148; }

        .loading {
            text-align: center;
            padding: 30px 20px;
            color: #666666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #870101;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fff5f5;
            border: 2px solid #A03434;
            color: #870101;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }

        .error strong {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .empty-state h3 {
            color: #0e313e;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Pull to Refresh Indicator */
        .pull-refresh {
            text-align: center;
            padding: 10px;
            color: white;
            font-size: 14px;
            display: none;
        }

        .pull-refresh.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Password Protection Overlay -->
    <div id="passwordOverlay" class="password-overlay">
        <div class="password-modal">
            <h2>🔒 E!BA Tracker</h2>
            <p>Enter password to access</p>
            <input 
                type="password" 
                id="passwordInput" 
                class="password-input" 
                placeholder="Password"
                autocomplete="current-password"
            >
            <button id="passwordSubmit" class="password-submit">Access Dashboard</button>
            <div id="passwordError" class="password-error"></div>
        </div>
    </div>

    <div class="pull-refresh" id="pullRefresh">↓ Pull to refresh</div>

    <div class="container">
        <div class="header">
            <h1>📊 E!BA Retention</h1>
            <div class="header-controls">
                <div class="venue-search-container">
                    <input 
                        type="text" 
                        id="venueSearchInput" 
                        class="venue-search-input" 
                        placeholder="Search or select venue..."
                        autocomplete="off"
                    >
                    <button id="venueClearBtn" class="venue-clear-btn">×</button>
                    <div id="venueDropdown" class="venue-dropdown"></div>
                </div>
                <div class="controls-row">
                    <div class="date-filter">
                        <button class="date-btn" id="yesterdayBtn">Yesterday</button>
                        <button class="date-btn active" id="todayBtn">Today</button>
                    </div>
                    <button id="refreshBtn" class="refresh-btn">🔄</button>
                </div>
                <div class="last-updated" id="lastUpdated"></div>
            </div>
        </div>

        <div id="metricsContainer"></div>
        <div id="dataContainer"></div>
    </div>

    <script>
        // Password Protection
        const CORRECT_PASSWORD = 'foa2026';
        const PASSWORD_STORAGE_KEY = 'eba_retention_auth';
        
        // Configuration
        const DATA_URL = 'https://script.google.com/macros/s/AKfycbyC7r_pUTVBJFpiKTcWx6_HsEVi6oH9YB2QlBCvwnVmGY3wvzsw9B6cgTJqgwbmOwqR/exec';
        const CALL_FORM_BASE_URL = 'https://expeducate.surveycto.com/collect/eba_2025_youth_absent_flow_up_script?caseid=';
        
        let allData = [];
        let filteredData = [];
        let currentVenue = '';
        let currentDate = 'today';

        // Check password on load
        document.addEventListener('DOMContentLoaded', () => {
            checkPassword();
            setupPasswordListener();
        });

        function checkPassword() {
            const savedPassword = localStorage.getItem(PASSWORD_STORAGE_KEY);
            
            if (savedPassword === CORRECT_PASSWORD) {
                document.getElementById('passwordOverlay').classList.add('hidden');
                initializeApp();
            }
        }

        function setupPasswordListener() {
            const passwordInput = document.getElementById('passwordInput');
            const passwordSubmit = document.getElementById('passwordSubmit');
            const passwordError = document.getElementById('passwordError');

            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    verifyPassword();
                }
            });

            passwordSubmit.addEventListener('click', verifyPassword);

            function verifyPassword() {
                const enteredPassword = passwordInput.value;
                
                if (enteredPassword === CORRECT_PASSWORD) {
                    localStorage.setItem(PASSWORD_STORAGE_KEY, enteredPassword);
                    document.getElementById('passwordOverlay').classList.add('hidden');
                    initializeApp();
                } else {
                    passwordError.textContent = 'Incorrect password';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }
        }

        function initializeApp() {
            loadData();
            setupEventListeners();
            setupPullToRefresh();
        }

        function setupEventListeners() {
            const venueSearchInput = document.getElementById('venueSearchInput');
            const venueDropdown = document.getElementById('venueDropdown');
            const venueClearBtn = document.getElementById('venueClearBtn');

            // Venue search input
            venueSearchInput.addEventListener('focus', () => {
                populateVenueDropdown();
                venueDropdown.classList.add('show');
            });

            venueSearchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                populateVenueDropdown(searchTerm);
                venueDropdown.classList.add('show');
                
                // Show/hide clear button
                if (e.target.value) {
                    venueClearBtn.classList.add('show');
                } else {
                    venueClearBtn.classList.remove('show');
                }
            });

            // Clear button
            venueClearBtn.addEventListener('click', () => {
                venueSearchInput.value = '';
                currentVenue = '';
                venueClearBtn.classList.remove('show');
                venueDropdown.classList.remove('show');
                filterAndDisplayData();
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.venue-search-container')) {
                    venueDropdown.classList.remove('show');
                }
            });

            document.getElementById('refreshBtn').addEventListener('click', () => {
                loadData();
            });

            document.getElementById('yesterdayBtn').addEventListener('click', () => {
                setDateFilter('yesterday');
            });

            document.getElementById('todayBtn').addEventListener('click', () => {
                setDateFilter('today');
            });
        }

        function setupPullToRefresh() {
            let startY = 0;
            let pulling = false;

            document.addEventListener('touchstart', (e) => {
                if (window.scrollY === 0) {
                    startY = e.touches[0].pageY;
                    pulling = true;
                }
            });

            document.addEventListener('touchmove', (e) => {
                if (pulling) {
                    const currentY = e.touches[0].pageY;
                    const pullDistance = currentY - startY;
                    
                    if (pullDistance > 80) {
                        document.getElementById('pullRefresh').classList.add('show');
                    }
                }
            });

            document.addEventListener('touchend', (e) => {
                if (pulling) {
                    const pullRefresh = document.getElementById('pullRefresh');
                    if (pullRefresh.classList.contains('show')) {
                        loadData();
                    }
                    pullRefresh.classList.remove('show');
                    pulling = false;
                }
            });
        }

        function setDateFilter(date) {
            currentDate = date;
            document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(date + 'Btn').classList.add('active');
            filterAndDisplayData();
        }

        async function loadData() {
            const refreshBtn = document.getElementById('refreshBtn');
            const dataContainer = document.getElementById('dataContainer');
            
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳';
            
            dataContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';

            try {
                const response = await fetch(DATA_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'API error');
                }
                
                allData = result.data || [];
                
                if (allData.length === 0) {
                    showError('No data found. Check Google Sheet.');
                    return;
                }
                
                populateVenueDropdown();
                filterAndDisplayData();
                
                const now = new Date();
                document.getElementById('lastUpdated').textContent = 
                    `Updated: ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
                
            } catch (error) {
                showError('Failed to load data. Check connection and try again.');
                console.error('Error:', error);
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄';
            }
        }

        function populateVenueDropdown(searchTerm = '') {
            const venues = [...new Set(allData.map(d => d.venue_name))].sort();
            const dropdown = document.getElementById('venueDropdown');
            
            // Filter venues based on search term
            const filteredVenues = searchTerm 
                ? venues.filter(v => v.toLowerCase().includes(searchTerm.toLowerCase()))
                : venues;
            
            if (filteredVenues.length === 0) {
                dropdown.innerHTML = '<div class="venue-option no-results">No venues found</div>';
                return;
            }

            // Add "All Venues" option if no search term
            let html = '';
            if (!searchTerm) {
                html = '<div class="venue-option" data-venue="">All Venues</div>';
            }
            
            // Add filtered venues
            html += filteredVenues.map(venue => 
                `<div class="venue-option" data-venue="${venue}">${venue}</div>`
            ).join('');
            
            dropdown.innerHTML = html;

            // Add click handlers to options
            dropdown.querySelectorAll('.venue-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    const selectedVenue = e.target.dataset.venue;
                    currentVenue = selectedVenue;
                    
                    const venueSearchInput = document.getElementById('venueSearchInput');
                    venueSearchInput.value = selectedVenue || 'All Venues';
                    
                    dropdown.classList.remove('show');
                    
                    if (selectedVenue) {
                        document.getElementById('venueClearBtn').classList.add('show');
                    } else {
                        document.getElementById('venueClearBtn').classList.remove('show');
                    }
                    
                    filterAndDisplayData();
                });
            });
        }

        function filterAndDisplayData() {
            const today = new Date();
            if (currentDate === 'yesterday') {
                today.setDate(today.getDate() - 1);
            }
            const targetDateStr = formatDate(today);

            filteredData = allData.filter(d => {
                const venueMatch = !currentVenue || d.venue_name === currentVenue;
                const dateMatch = d.absent_date === targetDateStr;
                return venueMatch && dateMatch;
            });

            displayMetrics();
            displayYouthCards();
        }

        function formatDate(date) {
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const year = date.getFullYear();
            return `${month}/${day}/${year}`;
        }

        function displayMetrics() {
            const metrics = {
                totalAbsent: filteredData.length,
                called: filteredData.filter(d => d.calls_made_today > 0).length,
                reached: filteredData.filter(d => d.calls_reached_today > 0).length,
                promised: filteredData.filter(d => d.promised_return_today > 0).length,
                refused: filteredData.filter(d => d.refused_return_today > 0).length,
                returned: filteredData.filter(d => d.returned_next_day > 0).length
            };
            
            const html = `
                <div class="metrics-grid">
                    <div class="metric-card absent">
                        <div class="metric-label">Absent</div>
                        <div class="metric-value">${metrics.totalAbsent}</div>
                    </div>
                    <div class="metric-card called">
                        <div class="metric-label">Called</div>
                        <div class="metric-value">${metrics.called}</div>
                    </div>
                    <div class="metric-card reached">
                        <div class="metric-label">Reached</div>
                        <div class="metric-value">${metrics.reached}</div>
                    </div>
                    <div class="metric-card promised">
                        <div class="metric-label">Promised</div>
                        <div class="metric-value">${metrics.promised}</div>
                    </div>
                    <div class="metric-card refused">
                        <div class="metric-label">Refused</div>
                        <div class="metric-value">${metrics.refused}</div>
                    </div>
                    <div class="metric-card returned">
                        <div class="metric-label">Returned</div>
                        <div class="metric-value">${metrics.returned}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('metricsContainer').innerHTML = html;
        }

        function displayYouthCards() {
            const container = document.getElementById('dataContainer');
            
            if (filteredData.length === 0) {
                const dateText = currentDate === 'today' ? 'today' : 'yesterday';
                const venueText = currentVenue || 'all venues';
                
                container.innerHTML = `
                    <div class="data-section">
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <h3>No data</h3>
                            <p>No records for ${venueText} on ${dateText}</p>
                            <p style="margin-top: 8px; font-size: 13px;">Try a different venue or date</p>
                        </div>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="data-section">
                    <div class="section-header">
                        <h2 class="section-title">Youth (${filteredData.length})</h2>
                        <input type="text" id="searchBox" class="search-box" placeholder="Search name or ID...">
                    </div>
                    <div class="youth-cards" id="youthCards">
                        ${renderYouthCards(filteredData)}
                    </div>
                </div>
            `;
            
            container.innerHTML = html;

            document.getElementById('searchBox').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filtered = filteredData.filter(d => 
                    d.youth_id.toLowerCase().includes(searchTerm) ||
                    d.youth_name.toLowerCase().includes(searchTerm)
                );
                document.getElementById('youthCards').innerHTML = renderYouthCards(filtered);
            });
        }

        function renderYouthCards(data) {
            if (data.length === 0) {
                return '<div style="text-align: center; padding: 30px; color: #666666;">No matching youth found</div>';
            }

            return data.map(youth => `
                <div class="youth-card">
                    <div class="youth-header">
                        <div class="youth-name">${youth.youth_name}</div>
                        <a href="${CALL_FORM_BASE_URL}${youth.youth_id}" 
                           target="_blank" 
                           class="youth-id-btn">
                            ${youth.youth_id} 📞
                        </a>
                    </div>
                    <div class="youth-details">
                        <div class="youth-detail">
                            <span class="detail-label">Gender</span>
                            <span class="detail-value">${youth.youth_gender}</span>
                        </div>
                        <div class="youth-detail">
                            <span class="detail-label">Calls Made</span>
                            <span class="detail-value">${youth.calls_made_today}</span>
                        </div>
                        <div class="youth-detail">
                            <span class="detail-label">Reached</span>
                            <span class="detail-value">${youth.calls_reached_today > 0 ? '✓ Yes' : '✗ No'}</span>
                        </div>
                        <div class="youth-detail">
                            <span class="detail-label">Status</span>
                            <span class="status-badge status-${getStatusClass(youth.followup_status)}">${youth.followup_status}</span>
                        </div>
                    </div>
                    ${youth.promised_return_today > 0 ? '<div style="margin-top: 8px;"><span class="status-badge status-promised">Promised to Return</span></div>' : ''}
                    ${youth.refused_return_today > 0 ? '<div style="margin-top: 8px;"><span class="status-badge status-refused">Refused Return</span></div>' : ''}
                    ${youth.returned_next_day > 0 ? '<div style="margin-top: 8px;"><span class="status-badge status-returned">✓ Returned</span></div>' : ''}
                </div>
            `).join('');
        }

        function getStatusClass(status) {
            const statusMap = {
                'Not Called': 'not-called',
                'Called': 'called',
                'Reached': 'reached',
                'Promised': 'promised',
                'Refused': 'refused',
                'Returned': 'returned'
            };
            return statusMap[status] || 'not-called';
        }

        function showError(message) {
            document.getElementById('metricsContainer').innerHTML = '';
            document.getElementById('dataContainer').innerHTML = `
                <div class="data-section">
                    <div class="error"><strong>Error</strong>${message}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
